<svg width="100%" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Multimodal Video Orchestrator — full pipeline</title>
  <desc>Pipeline showing four topic selection paths converging, then Gemini image+quote generation, Ken Burns user input, ElevenLabs and Suno generation, and final video assembly.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: ui-sans-serif, system-ui, sans-serif; }
      .th  { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
      .ts  { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; }

      /* gray */
      .c-gray rect, .c-gray circle { fill: #F1EFE8; stroke: #5F5E5A; }
      .c-gray .th { fill: #444441; }
      .c-gray .ts { fill: #5F5E5A; }

      /* teal */
      .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
      .c-teal .th  { fill: #085041; }
      .c-teal .ts  { fill: #0F6E56; }

      /* blue */
      .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
      .c-blue .th  { fill: #0C447C; }
      .c-blue .ts  { fill: #185FA5; }

      /* purple */
      .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
      .c-purple .th  { fill: #3C3489; }
      .c-purple .ts  { fill: #534AB7; }

      /* coral */
      .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
      .c-coral .th  { fill: #712B13; }
      .c-coral .ts  { fill: #993C1D; }

      /* amber */
      .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
      .c-amber .th  { fill: #633806; }
      .c-amber .ts  { fill: #854F0B; }
    </style>
  </defs>

  <!-- User input -->
  <g class="c-gray">
    <rect x="270" y="20" width="140" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">User input</text>
  </g>

  <!-- Fan out arrows -->
  <line x1="310" y1="60" x2="80"  y2="110" class="arr" marker-end="url(#arrow)"/>
  <line x1="325" y1="60" x2="230" y2="110" class="arr" marker-end="url(#arrow)"/>
  <line x1="355" y1="60" x2="450" y2="110" class="arr" marker-end="url(#arrow)"/>
  <line x1="370" y1="60" x2="600" y2="110" class="arr" marker-end="url(#arrow)"/>

  <!-- AI trending -->
  <g class="c-teal">
    <rect x="30" y="110" width="100" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="80" y="130" text-anchor="middle" dominant-baseline="central">AI trending</text>
  </g>

  <!-- Random roulette -->
  <g class="c-teal">
    <rect x="180" y="110" width="110" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="235" y="130" text-anchor="middle" dominant-baseline="central">Random roulette</text>
  </g>

  <!-- Manual override -->
  <g class="c-teal">
    <rect x="398" y="110" width="106" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="451" y="130" text-anchor="middle" dominant-baseline="central">Manual override</text>
  </g>

  <!-- Bring your own images -->
  <g class="c-teal">
    <rect x="548" y="110" width="106" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="601" y="122" text-anchor="middle" dominant-baseline="central">Bring your</text>
    <text class="th" x="601" y="138" text-anchor="middle" dominant-baseline="central">own images</text>
  </g>

  <!-- ChromaDB + Tavily -->
  <line x1="80" y1="150" x2="80" y2="185" class="arr" marker-end="url(#arrow)"/>
  <g class="c-blue">
    <rect x="18" y="185" width="124" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="80" y="203" text-anchor="middle" dominant-baseline="central">ChromaDB + Tavily</text>
    <text class="ts" x="80" y="221" text-anchor="middle" dominant-baseline="central">Newspaper headlines</text>
  </g>

  <!-- User provides -->
  <line x1="601" y1="150" x2="601" y2="185" class="arr" marker-end="url(#arrow)"/>
  <g class="c-blue">
    <rect x="541" y="185" width="120" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="601" y="203" text-anchor="middle" dominant-baseline="central">User provides</text>
    <text class="ts" x="601" y="221" text-anchor="middle" dominant-baseline="central">Images, topic, quotes</text>
  </g>

  <!-- Converge arrows to Topics selected -->
  <line x1="80"  y1="237" x2="264" y2="285" class="arr" marker-end="url(#arrow)"/>
  <line x1="232" y1="150" x2="290" y2="285" class="arr" marker-end="url(#arrow)"/>
  <line x1="451" y1="150" x2="376" y2="285" class="arr" marker-end="url(#arrow)"/>

  <!-- Topics selected -->
  <g class="c-purple">
    <rect x="210" y="285" width="220" height="44" rx="8" stroke-width="0.5"/>
    <text class="th" x="320" y="300" text-anchor="middle" dominant-baseline="central">Topics selected</text>
    <text class="ts" x="320" y="318" text-anchor="middle" dominant-baseline="central">All paths converge here</text>
  </g>

  <!-- Topics → Gemini -->
  <line x1="320" y1="329" x2="320" y2="365" class="arr" marker-end="url(#arrow)"/>

  <!-- Gemini image + quotes -->
  <g class="c-coral">
    <rect x="160" y="365" width="320" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="320" y="383" text-anchor="middle" dominant-baseline="central">Gemini</text>
    <text class="ts" x="320" y="401" text-anchor="middle" dominant-baseline="central">Generates images + quotes per topic</text>
  </g>

  <!-- Bypass dashed arrow: Bring your own → Ken Burns -->
  <path d="M601 237 L601 441 L472 441" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="5 4" marker-end="url(#arrow-dash)"/>

  <!-- Gemini → Ken Burns -->
  <line x1="320" y1="417" x2="320" y2="455" class="arr" marker-end="url(#arrow)"/>

  <!-- Ken Burns -->
  <g class="c-amber">
    <rect x="160" y="455" width="320" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="320" y="473" text-anchor="middle" dominant-baseline="central">User: Ken Burns corner selection</text>
    <text class="ts" x="320" y="491" text-anchor="middle" dominant-baseline="central">Dropdown — manual input</text>
  </g>

  <!-- Ken Burns → ElevenLabs and Suno -->
  <line x1="260" y1="507" x2="160" y2="560" class="arr" marker-end="url(#arrow)"/>
  <line x1="380" y1="507" x2="480" y2="560" class="arr" marker-end="url(#arrow)"/>

  <!-- ElevenLabs -->
  <g class="c-coral">
    <rect x="50" y="560" width="210" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="155" y="578" text-anchor="middle" dominant-baseline="central">ElevenLabs</text>
    <text class="ts" x="155" y="596" text-anchor="middle" dominant-baseline="central">Quotes → voiceover</text>
  </g>

  <!-- Suno path -->
  <g class="c-coral">
    <rect x="418" y="560" width="212" height="52" rx="8" stroke-width="0.5"/>
    <text class="th" x="524" y="572" text-anchor="middle" dominant-baseline="central">Gemini → Suno prompt</text>
    <text class="ts" x="524" y="588" text-anchor="middle" dominant-baseline="central">Image + topic + quotes</text>
    <text class="ts" x="524" y="604" text-anchor="middle" dominant-baseline="central">→ Suno generates song</text>
  </g>

  <!-- Converge to final video -->
  <line x1="155" y1="612" x2="264" y2="655" class="arr" marker-end="url(#arrow)"/>
  <line x1="524" y1="612" x2="406" y2="655" class="arr" marker-end="url(#arrow)"/>

  <!-- Final video -->
  <g class="c-gray">
    <rect x="210" y="655" width="220" height="40" rx="8" stroke-width="0.5"/>
    <text class="th" x="320" y="675" text-anchor="middle" dominant-baseline="central">Video assembled (MP4)</text>
  </g>

</svg>
